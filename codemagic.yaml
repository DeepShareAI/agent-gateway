workflows:
  android-production:
    name: Android production artifact
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: 3.35.7
      java: 17
      android_signing:
        - agent_gateway_production
    scripts:
      - name: Verify release commit and build number
        script: |
          set -eu
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT:?GitHub Actions must supply EXPECTED_COMMIT}"
          test -n "${RELEASE_BUILD_NUMBER:?GitHub Actions must supply RELEASE_BUILD_NUMBER}"
      - name: Check Flutter application
        script: |
          set -eu
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Build signed Android artifacts
        script: |
          set -eu
          flutter build appbundle --release --build-number="$RELEASE_BUILD_NUMBER"
          flutter build apk --release --build-number="$RELEASE_BUILD_NUMBER"
    artifacts:
      - mobile/build/app/outputs/bundle/release/*.aab
      - mobile/build/app/outputs/flutter-apk/*-release.apk

  ios-production:
    name: iOS production artifact
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: 3.35.7
      xcode: 16.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.agentgateway.agentGatewayMobile
    scripts:
      - name: Verify release commit and build number
        script: |
          set -eu
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT:?GitHub Actions must supply EXPECTED_COMMIT}"
          test -n "${RELEASE_BUILD_NUMBER:?GitHub Actions must supply RELEASE_BUILD_NUMBER}"
      - name: Check Flutter application
        script: |
          set -eu
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Configure signing and build IPA
        script: |
          set -eu
          xcode-project use-profiles
          flutter build ipa --release --build-number="$RELEASE_BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
